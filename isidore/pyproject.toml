[project]
name = "isidore"
version = "0.1.0"
description = "Spawn isolated Pi coding-agent tasks from a web UI or Telegram"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.48",
    "uvicorn>=0.31",
    "httpx>=0.27",
]

[project.scripts]
isidore = "isidore.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isidore"]
