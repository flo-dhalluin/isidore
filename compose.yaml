# Pi coding agent sandbox: isidore (web UI + task runner), a headless Firefox
# MCP server, and a scheduler, each in a locked-down container. The images
# install Pi themselves; nothing is needed on the host but Docker and an
# OpenRouter key.
#
#   mkdir -p ~/.local/state/pi-sandbox/isidore ~/.local/state/pi-sandbox/scheduler
#   PI_SANDBOX_KEY_FILE=~/.openrouter-key docker compose up -d --build
#
# See README.md. The key is a file (compose secret), never an env var or an
# image layer.
name: isidore

x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  browser:
    <<: *hardening
    build: browser-tool
    image: pi-sandbox-browser
    shm_size: 1g
    pids_limit: 1024
    mem_limit: ${BROWSER_MCP_MEMORY:-3g}
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=2g
    environment:
      BROWSER_MCP_ALLOW_JS: ${BROWSER_MCP_ALLOW_JS:-0}
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8931), 1)"]
      interval: 10s
      start_period: 10s
      start_interval: 0.5s
    restart: unless-stopped

  # isidore: run isolated Pi tasks from a web UI or Telegram. Each task is its
  # own Node worker process (Pi TypeScript SDK) in /state/workspaces.
  isidore:
    <<: *hardening
    build:
      context: isidore
      args:
        PI_VERSION: ${PI_VERSION:-latest}
        PI_WEB_PACKAGE: ${PI_WEB_PACKAGE:-pi-web-access}
    image: pi-sandbox-isidore:${PI_VERSION:-latest}
    hostname: isidore
    user: ${PI_UID:-1000}:${PI_GID:-1000}
    pids_limit: ${PI_SANDBOX_PIDS:-512}
    mem_limit: ${ISIDORE_MEMORY:-4g}
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=${PI_SANDBOX_TMP_SIZE:-2g}
    # Bound to loopback: put a reverse proxy in front for remote access.
    ports:
      - "127.0.0.1:${ISIDORE_PORT:-8920}:8920"
    volumes:
      - ${ISIDORE_STATE:-${XDG_STATE_HOME:-${HOME}/.local/state}/pi-sandbox/isidore}:/state
      # Effective admin token, written by isidore at startup (rw) and read by
      # the scheduler (ro) so it can authenticate without a shared env secret.
      - isidore-admin:/state/shared
      # Scheduler admin token, generated by the scheduler at startup when
      # SCHEDULER_TOKEN is unset; isidore reads it per-request (ro).
      - scheduler-auth:/state/scheduler-shared:ro
    secrets: [openrouter, telegram]
    environment:
      ISIDORE_STATE: /state
      ISIDORE_HOST: 0.0.0.0
      ISIDORE_PORT: "8920"
      ISIDORE_MODEL: ${PI_SANDBOX_MODEL:-}
      ISIDORE_MAX_WORKERS: ${ISIDORE_MAX_WORKERS:-2}
      ISIDORE_TASK_TIMEOUT: ${ISIDORE_TASK_TIMEOUT:-}
      ISIDORE_TOKEN: ${ISIDORE_TOKEN:-}
      ISIDORE_SCHEDULER_URL: http://scheduler:8940
      ISIDORE_SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
      # Read the scheduler admin token from the shared volume when no env
      # token is set (the scheduler generates one at startup when unset).
      ISIDORE_SCHEDULER_TOKEN_FILE: /state/scheduler-shared/scheduler-token
      ISIDORE_TELEGRAM_TOKEN_FILE: /run/secrets/telegram
      ISIDORE_TELEGRAM_CHATS: ${ISIDORE_TELEGRAM_CHATS:-}
      # Optional public HTTPS URL proxied to isidore's /telegram/webhook;
      # empty = long polling.
      ISIDORE_TELEGRAM_WEBHOOK_URL: ${ISIDORE_TELEGRAM_WEBHOOK_URL:-}
      PI_SANDBOX_BROWSER_URL: http://browser:8931/mcp
      PI_SANDBOX_SCHEDULER_URL: http://scheduler:8940/mcp
      # Tools authoring MCP (Phase 3): workers reach isidore's own endpoint by
      # service name (they share isidore's network namespace; loopback would
      # also work, but the service URL is explicit and override-friendly).
      ISIDORE_TOOLS_URL: ${ISIDORE_TOOLS_URL:-http://isidore:8920/mcp/tools}
      NO_PROXY: ${NO_PROXY:-127.0.0.0/8,localhost},browser,scheduler,isidore
      no_proxy: ${NO_PROXY:-127.0.0.0/8,localhost},browser,scheduler,isidore
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-pi-sandbox}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-pi-sandbox@localhost}
      LANG: ${LANG:-C.UTF-8}
      TZ: ${TZ:-}
    depends_on:
      browser:
        condition: service_healthy
      scheduler:
        condition: service_started
    restart: unless-stopped

  # scheduler: MCP tool server + REST API + firing loop. Calls isidore to
  # spawn tasks; state (schedules.json) lives in /state.
  scheduler:
    <<: *hardening
    build: scheduler
    image: pi-sandbox-scheduler
    hostname: scheduler
    user: ${PI_UID:-1000}:${PI_GID:-1000}
    pids_limit: 128
    mem_limit: ${SCHEDULER_MEMORY:-256m}
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=64m
    volumes:
      - ${SCHEDULER_STATE:-${XDG_STATE_HOME:-${HOME}/.local/state}/pi-sandbox/scheduler}:/state
      - isidore-admin:/isidore-shared:ro
      # Writable: the scheduler publishes its generated admin token here
      # (scheduler-token) for isidore to read.
      - scheduler-auth:/shared
    environment:
      SCHEDULER_STATE: /state
      SCHEDULER_HOST: 0.0.0.0
      SCHEDULER_PORT: "8940"
      SCHEDULER_ISIDORE_URL: http://isidore:8920
      SCHEDULER_ISIDORE_TOKEN: ${ISIDORE_TOKEN:-}
      # Read the admin token from the shared volume when no env token is set.
      SCHEDULER_ISIDORE_TOKEN_FILE: /isidore-shared/admin-token
      # Where the generated scheduler admin token is published (scheduler-auth
      # volume, mounted rw at /shared).
      SCHEDULER_SHARED_DIR: /shared
      # Scope MCP tool calls to the caller's conversation ("0" = legacy open).
      SCHEDULER_MCP_SCOPING: "1"
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
      SCHEDULER_TICK: ${SCHEDULER_TICK:-1}
      SCHEDULER_RETRY_DELAY: ${SCHEDULER_RETRY_DELAY:-30}
      NO_PROXY: ${NO_PROXY:-127.0.0.0/8,localhost},browser,scheduler,isidore
      no_proxy: ${NO_PROXY:-127.0.0.0/8,localhost},browser,scheduler,isidore
      TZ: ${TZ:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8940), 1)"]
      interval: 10s
      start_period: 5s
      start_interval: 0.5s
    restart: unless-stopped

secrets:
  # A file, bind-mounted read-only at /run/secrets/openrouter (environment
  # secrets need a writable rootfs).
  openrouter:
    file: ${PI_SANDBOX_KEY_FILE:-/dev/null}
  # Telegram bot token, read by isidore itself (never exported to tasks).
  # Empty (/dev/null) disables the bot.
  telegram:
    file: ${ISIDORE_TELEGRAM_TOKEN_FILE:-/dev/null}

volumes:
  # Holds the effective isidore admin token (shared/admin-token). isidore mounts
  # it rw at /state/shared; the scheduler mounts it ro at /isidore-shared. No admin
  # secret is baked into the worker-readable /state/pi/mcp.json.
  isidore-admin:
  # Holds the effective scheduler admin token (scheduler-token), generated by
  # the scheduler at startup when SCHEDULER_TOKEN is unset. The scheduler
  # mounts it rw at /shared; isidore mounts it ro at /state/scheduler-shared.
  # Workers never see it: /state is outside the Landlock allow-list and the
  # SCHEDULER_*/ISIDORE_* env scrub covers the service env.
  scheduler-auth:

# Dual-stack network. On an IPv6-only host the containers need IPv6 to reach
# the internet (OpenRouter, browsing, Telegram); IPv4 stays for the
# service-to-service traffic (services listen on 0.0.0.0). Docker allocates an
# IPv4 subnet and a ULA IPv6 subnet automatically, so no explicit subnet is
# needed here. Requires `ipv6: true` in the daemon config.
networks:
  default:
    enable_ipv6: true
