[project]
name = "scheduler"
version = "0.1.0"
description = "One-shot and recurring task scheduler for isidore, exposed as an MCP tool"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.27",
]

[project.scripts]
scheduler = "scheduler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scheduler"]
